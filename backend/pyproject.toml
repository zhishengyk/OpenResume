[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openresume-api"
version = "0.1.0"
description = "OpenResume 桌面应用的本地接口服务。"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.20",
  "pypdf>=5.4.0",
  "python-docx>=1.1.2",
  "httpx>=0.28.1"
]

[project.optional-dependencies]
automation = ["playwright>=1.50"]
packaging = ["pyinstaller>=6.14"]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
